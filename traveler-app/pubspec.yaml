name: traveler_app
description: "LocalLens Traveler Mobile Application (Flutter)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0
  flutter_svg: ^2.0.17
  lottie: ^3.1.3
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.8.3
  google_sign_in: ^6.2.2
  google_maps_flutter: ^2.10.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/onboarding/
    - assets/images/characters/
    - assets/images/destinations/
    - assets/images/illustrations/
    - assets/images/maps/
    - assets/images/rides/
